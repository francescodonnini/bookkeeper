name: Java CI with Maven

on:
  push:
    branches: [ "francesco" ]
  pull_request:
    branches: [ "francesco" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Generate, Test, Coverage, and Mutate
          # This single command sequentially runs the lifecycle up to 'test' (which includes generation and JaCoCo),
          # then executes the JaCoCo report, and finally runs PIT mutation testing.
        run: >
          mvn test jacoco:report org.pitest:pitest-maven:mutationCoverage 
          -Pjacoco,pit,randoop,evosuite 
          -pl bookkeeper-server
