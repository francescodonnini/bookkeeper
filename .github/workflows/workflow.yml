name: Java CI with Maven

on:
  push:
    branches: [ "francesco" ]
  pull_request:
    branches: [ "francesco" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: JaCoCo
        run: mvn test -Pjacoco -pl bookkeeper-server

      - name: PIT
        run: mvn org.pitest:pitest-maven:mutationCoverage -Ppit -pl bookkeeper-server

      - name: Randoop
        run: mvn test -Prandoop -pl bookkeeper-server

      - name: EvoSuite
        run: mvn test -Pevosuite -pl bookkeeper-server