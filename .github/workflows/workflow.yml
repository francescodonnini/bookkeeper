name: Java CI with Maven

on:
  push:
    branches: [ "francesco" ]
  pull_request:
    branches: [ "francesco" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Generate, Test, Coverage, and Mutate
        run: >
          mvn test jacoco:report org.pitest:pitest-maven:mutationCoverage 
          -Pjacoco,pit,randoop 
          -pl bookkeeper-server

      - name: Upload JaCoCo and PIT reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: test-reports
          path: |
            bookkeeper-server/target/site/jacoco
            bookkeeper-server/target/pit-reports

      - name: Upload Auto-generated Tests
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auto-generated-tests
          path: |
            bookkeeper-server/target/generated-test-sources/randoop
